description: >-
  EST (EST Media) is a Los Angeles-based media holding company founded by Jaeson Ma and Eric Tu that
  amplifies Asian stories and talent for global audiences. It operates three divisions: EST Studios,
  which develops, finances, produces, and sells Asian film and television projects; Eastern Standard
  Times, a Gen Z digital video platform sharing untold stories from Asia and its diaspora; and
  Established, a content studio partnering with global brands on advertising campaigns, influencer
  collaborations, commercials, and experiential events. EST Media is a 500 Global portfolio company.
  It publishes no public API or developer platform; this profile carries company identity and a
  domain-security probe only.
